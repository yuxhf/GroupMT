<script>window.lessonConfig={"pdf":"https://deep-learning-alchemy.github.io/assets/slides/lecture_02.pdf","sections":[{"start":1,"end":5,"en":"Experimental science","zh":"实验方法","body":"先写出可检验的预测，再改变变量并观察结果；实验的意义不是盲目试错，而是缩小对训练机制的解释范围。","key":"记录基线、干预、结果和不确定性。","q":"怎样用最小实验区分两个假设？"},{"start":6,"end":8,"en":"Hyperparameters","zh":"超参数","body":"失败的训练只说明当前配置不合适，不等价于模型或方法无效。学习率、批大小、训练长度和模型尺寸相互作用。","key":"改变模型后要重新搜索超参数。","q":"发散时先检查哪些变量？"},{"start":9,"end":12,"en":"Tuning case studies","zh":"调参改变研究结论","body":"DP-SGD、重复数据和优化器的比较说明，沿用旧方法的最佳超参数会使新方法被低估。应分别找到合理最佳配置，并披露搜索预算。","key":"区分固定配方比较和充分调参比较。","q":"怎样检验性能差距是否只是调参不足？"},{"start":13,"end":17,"en":"Learning rate × batch size","zh":"联合搜索","body":"将验证损失绘制在 log LR 与 batch size 平面上；最低点和低损失区域的宽度都重要。模型规模变化可能移动最优区域。","key":"对数网格粗搜，再局部细搜。","q":"固定学习率是否会改变方法排序？"},{"start":18,"end":20,"en":"Efficient sweeps","zh":"高效搜索","body":"小模型上的并行计算可摊薄实验开销，vmap 可帮助批量执行相似计算。但代理实验必须检查目标机制在大规模上是否保留。","key":"分配预算给覆盖范围、重复实验和规模验证。","q":"哪些干预最适合先用小模型筛选？"},{"start":21,"end":25,"en":"Scaling as proxy","zh":"缩放代理","body":"通过参数规模、数据量与计算预算的阶梯实验观察趋势，再谨慎外推；模型族和训练配方应一致。","key":"同时记录 N、D、FLOPs 与配方。","q":"如何验证小模型是可靠代理？"},{"start":26,"end":29,"en":"Power laws","zh":"幂律","body":"损失可用含下限的幂函数近似，例如 L=A N^(-α)+B D^(-β)+C。模型和数据各自可能成为瓶颈。","key":"渐近项不等于可直接测量的不可约损失。","q":"固定预算应优先扩大哪一项？"},{"start":30,"end":33,"en":"Scaling pitfalls","zh":"缩放陷阱","body":"不一致的参数/FLOP 定义、未随尺寸调整的学习率，会导致看似违反幂律的曲线。","key":"先校准配方再解释性能变化。","q":"为什么固定 LR 的 scaling curve 可能误导？"},{"start":34,"end":38,"en":"Randomness","zh":"随机性","body":"初始化、数据顺序及随机训练干预会影响轨迹。分离种子来源，比较同一组配对条件，而不是把所有变化归因于架构。","key":"报告多个 seed 及其分布。","q":"仅改变数据种子能检验什么？"},{"start":39,"end":44,"en":"Chaos and significance","zh":"混沌与统计检验","body":"微小扰动可被训练动态放大。配对实验对每对结果的差值 d 求均值及 SE=sd(d)/√n，小样本可用 t 区间。","key":"两组均值误差条重叠不代表配对差异不显著。","q":"如何区分随机波动和真实改善？"},{"start":45,"end":49,"en":"Diagnostics","zh":"训练诊断","body":"Loss 曲线是症状，不是机制。对齐学习率调度与损失异常时刻，查看梯度、激活和参数统计。","key":"记录异常开始的时间和层。","q":"停滞和发散的诊断信号有何不同？"},{"start":50,"end":52,"en":"Activation and gradient norms","zh":"范数诊断","body":"逐层检查 RMS、注意力分数及梯度。QK norm 前后比较可揭示 logits 的尺度变化；尺度不变的参数需另外解释。","key":"范数大不必然表示贡献大。","q":"某层梯度很小是否代表没有学习？"},{"start":53,"end":57,"en":"Debugging workflow","zh":"系统调试","body":"从可复现的正常配置出发逐步插值到故障设置。Marin 案例启发我们联合观察权重范数和门控激活。","key":"每次只改变一项，保存失败运行。","q":"若 weight decay 恢复训练，如何验证原因？"}]};</script><script src="../../shared/reader-v3.js"></script>
